<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up early | GvCode</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        background: #f4f4f5;
        color: #18181b;
      }

      .card {
        width: min(100%, 28rem);
        padding: 2rem;
        box-sizing: border-box;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        text-align: center;
      }

      .intro {
        color: #52525b;
        line-height: 1.5;
        text-align: center;
      }

      label {
        display: block;
        margin-top: 1rem;
        font-weight: 600;
      }

      input {
        width: 100%;
        margin-top: 0.4rem;
        padding: 0.75rem;
        box-sizing: border-box;
        border: 1px solid #a1a1aa;
        border-radius: 6px;
        font: inherit;
      }

      input:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #2563eb;
        outline-offset: 2px;
      }

      button {
        width: 100%;
        min-height: 2.8rem;
        margin-top: 1.5rem;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .status {
        min-height: 1.5rem;
        margin: 1rem 0 0;
        color: #52525b;
        text-align: center;
      }

      .status.error {
        color: #b91c1c;
      }

      .back-link {
        display: block;
        margin-top: 1rem;
        color: #2563eb;
        text-align: center;
      }

      .spinner {
        display: inline-block;
        width: 1rem;
        height: 1rem;
        margin-right: 0.5rem;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        vertical-align: -0.2rem;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sign up early for GvCode</h1>
      <p class="intro">Share your email and preferred username to join the early signup list. No password is collected on this page.</p>
      <form id="signup-form" action="https://formspree.io/f/xqpqgwvw" method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />

        <button id="submit-button" type="submit">Continue</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
      <a class="back-link" href="index.html">Back to GvCode</a>
    </main>

    <script src="signup.js" defer></script>
  </body>
</html>
